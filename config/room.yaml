audio:
  sample_rate: 48000
  channels: 8

  # v0.3 automatically learns each mic's quiet-room noise floor at startup.
  calibration_seconds: 3.0

  # A channel must satisfy BOTH absolute level and rise-above-own-floor gates.
  absolute_threshold_db: -50.0
  signal_margin_db: 8.0

  # A challenger should beat the current mic by this much before handoff.
  dominance_margin_db: 3.0

  # Fast first shot, slower handoffs so tiny interjections do not whip the camera.
  initial_activation_ms: 250
  switch_delay_ms: 650
  hold_time_ms: 1200
  silence_timeout_ms: 5000
  confidence_min: 0.55

