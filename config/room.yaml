runtime:
  mode: simulate
  device_name: null
  device_index: null
  hostapi_name: null
  auto_start: true
  log_dir: logs
  audio_stale_seconds: 1.5

# This global safety gate remains false unless an operator intentionally enables
# real PTZ transmission after configuring and testing a known camera.
real_control_enabled: false

camera_control:
  command_interval_seconds: 0.10
  movement_cooldown_seconds: 0.75
  retry_count: 1
  retry_backoff_seconds: 0.10

cameras:
  - id: 1
    name: Camera 1
    driver: simulator
    host: null
    port: null
    username: null
    password_env: null
    profile_token: null
    timeout_seconds: 1.0
    enabled: true
audio:
  sample_rate: 48000
  channels: 4
  channel_map: [1, 2, 3, 4]
  identifier_channels: 4
  calibration_seconds: 3.0
  absolute_threshold_db: -50.0
  signal_margin_db: 8.0
  dominance_margin_db: 3.0
  initial_activation_ms: 250
  switch_delay_ms: 650
  hold_time_ms: 1200
  silence_timeout_ms: 5000
  confidence_min: 0.55

people:
  - {mic_channel: 1, name: Seat 1, camera: 1, preset: 1}
  - {mic_channel: 2, name: Seat 2, camera: 1, preset: 2}
  - {mic_channel: 3, name: Seat 3, camera: 1, preset: 3}
  - {mic_channel: 4, name: Seat 4, camera: 1, preset: 4}

wide_shot:
  camera: 1
  preset: 20
