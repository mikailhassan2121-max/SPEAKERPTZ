# Copy this file to config/local.yaml on the SCHOOL COMPUTER.
# config/local.yaml is intentionally ignored by Git so each installation can
# keep its own device selection, seat names, and camera preset map.

runtime:
  mode: real
  # Prefer a stable name substring over a Windows device index, because device
  # numbers can change after reboots or hardware changes.
  device_name: "Dante Virtual Soundcard"
  device_index: null
  auto_start: true
  log_dir: logs

audio:
  sample_rate: 48000
  channels: 8
  calibration_seconds: 3.0
  absolute_threshold_db: -50.0
  signal_margin_db: 8.0
  dominance_margin_db: 3.0
  initial_activation_ms: 250
  switch_delay_ms: 650
  hold_time_ms: 1200
  silence_timeout_ms: 5000
  confidence_min: 0.55

people:
  - mic_channel: 1
    name: Board Member 1
    camera: 1
    preset: 1
  - mic_channel: 2
    name: Board Member 2
    camera: 1
    preset: 2
  - mic_channel: 3
    name: Board Member 3
    camera: 1
    preset: 3
  - mic_channel: 4
    name: Board Member 4
    camera: 1
    preset: 4
  - mic_channel: 5
    name: Board Member 5
    camera: 1
    preset: 5
  - mic_channel: 6
    name: Superintendent
    camera: 1
    preset: 6
  - mic_channel: 7
    name: Podium
    camera: 2
    preset: 1
  - mic_channel: 8
    name: Spare
    camera: 1
    preset: 8

wide_shot:
  camera: 1
  preset: 20
