# Copy this file to config/local.yaml on the SCHOOL COMPUTER.
# config/local.yaml is intentionally ignored by Git.

runtime:
  mode: real
  # Prefer a stable name substring over a Windows device index.
  device_name: "Dante Virtual Soundcard"
  device_index: null
  # Optional: if Windows exposes the same endpoint through several host APIs,
  # add a substring such as "WASAPI" after checking list_audio_devices.bat.
  hostapi_name: null
  auto_start: true
  log_dir: logs
  audio_stale_seconds: 1.5

# REAL CAMERA SAFETY GATE. Leave false during setup and all audio dry runs.
# A non-simulator camera driver is replaced by a harmless simulator until this
# is deliberately changed to true.
real_control_enabled: false

camera_control:
  command_interval_seconds: 0.10
  movement_cooldown_seconds: 0.75
  retry_count: 1
  retry_backoff_seconds: 0.10

cameras:
  - id: 1
    name: Camera 1
    driver: simulator       # Later: visca OR onvif, after model confirmation
    host: null              # Exact single camera IP; no subnet scanning
    port: null              # VISCA default 52381; ONVIF default 80
    username: null          # ONVIF only
    password_env: null      # Example: SPEAKERPTZ_CAMERA_1_PASSWORD
    profile_token: null     # ONVIF only; null chooses the first media profile
    timeout_seconds: 1.0
    enabled: true
audio:
  sample_rate: 48000

  # Number of logical microphones SPEAKERPTZ will analyze.
  channels: 4

  # Map each logical MIC to a 1-based physical DVS input.
  # Example [5,6,9,10] means MIC 1<-DVS 5, MIC 2<-DVS 6, etc.
  channel_map: [1, 2, 3, 4]

  # Number of raw physical inputs shown by identify_dante_channels.bat.
  identifier_channels: 4

  calibration_seconds: 3.0
  absolute_threshold_db: -50.0
  signal_margin_db: 8.0
  dominance_margin_db: 3.0
  initial_activation_ms: 250
  switch_delay_ms: 650
  hold_time_ms: 1200
  silence_timeout_ms: 5000
  confidence_min: 0.55

people:
  # Generic placeholders only. Put the actual room mapping in config/local.yaml.
  - {mic_channel: 1, name: Seat 1, camera: 1, preset: 1}
  - {mic_channel: 2, name: Seat 2, camera: 1, preset: 2}
  - {mic_channel: 3, name: Seat 3, camera: 1, preset: 3}
  - {mic_channel: 4, name: Seat 4, camera: 1, preset: 4}

wide_shot:
  camera: 1
  preset: 20
